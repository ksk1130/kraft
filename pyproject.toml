[project]
name = "kraft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sasaki Keisuke", email = "ksk.andr@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "textual>=0.80.0",
    "deepagents>=0.1.0",
    "langgraph>=0.2.0",
    "langchain-openai>=1.6.0",
]

[project.scripts]
kraft = "kraft.tui:run"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
